<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示例 05 · 落地页里的一块</title>
<style>
  :root{--bg:#0A0C16;--ink:#E8E7EE;--muted:#7E849F;--accent:#FFB25C;--hair:rgba(232,231,238,.12)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Noto Serif CJK SC","Songti SC",Georgia,serif}
  header{padding:46px clamp(22px,6vw,90px) 0;display:flex;justify-content:space-between;
         font:11px/1 "DejaVu Sans Mono",monospace;letter-spacing:.2em;color:var(--muted)}
  .band{padding:clamp(46px,8vw,110px) clamp(22px,6vw,90px);display:grid;
        grid-template-columns:minmax(0,1fr) auto;gap:clamp(26px,5vw,72px);align-items:center;
        border-bottom:1px solid var(--hair)}
  .copy h1{font-size:clamp(28px,3.6vw,46px);line-height:1.12;margin:0 0 16px;letter-spacing:-.01em}
  .copy h1 em{font-style:normal;color:var(--accent)}
  .copy p{max-width:30em;color:var(--muted);margin:0 0 22px}
  .meta{display:flex;gap:26px;font:11px/1.9 "DejaVu Sans Mono",monospace;letter-spacing:.12em;color:var(--muted);flex-wrap:wrap}
  .meta b{display:block;color:var(--ink);font-size:15px;letter-spacing:0;margin-bottom:2px}
  .foot{padding:26px clamp(22px,6vw,90px);font:11px/1.9 "DejaVu Sans Mono",monospace;letter-spacing:.14em;color:var(--muted)}
  @media(max-width:860px){.band{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><span>DIORAMA SWITCH</span><span>WEB / 2026</span></header>

<section class="band">
  <div class="copy">
    <h1>把一间房，<br>压进一枚<em>开关</em>里。</h1>
    <p>它不是带灯的开关，是一盏灯里的一间房。球滑到左边是清晨，滑到右边是深夜，中间没有一格是断的。</p>
    <div class="meta">
      <div><b>1.82 : 1</b>胶囊比例</div>
      <div><b>± 8 %</b>视差</div>
      <div><b>640 ms</b>昼夜吸附</div>
      <div><b>44 – 720 px</b>尺寸</div>
    </div>
  </div>
  <diorama-switch room="archive" height="300" value="1"></diorama-switch>
</section>

<section class="band" style="grid-template-columns:auto minmax(0,1fr)">
  <diorama-switch room="garden" height="220" value="0"></diorama-switch>
  <div class="copy">
    <h1 style="font-size:clamp(22px,2.4vw,30px)">换的不是滤镜，<br>是这间房原本的样子。</h1>
    <p>每间房只是两张贴图加四个坐标 —— 灯在哪、窗朝哪。所以你可以把它放进任何页面，它会自己在那儿亮起来。</p>
  </div>
</section>

<div class="foot">示例 05 / 一枚组件嵌进普通落地页，不需要任何布局改造</div>
<script type="module" src="../src/diorama-switch.js"></script>
</body>
</html>
