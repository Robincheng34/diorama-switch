<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示例 04 · 从 44 到 280，同一枚开关</title>
<style>
  :root{--bg:#0A0C16;--ink:#E8E7EE;--muted:#7E849F;--hair:rgba(232,231,238,.13)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Serif CJK SC",Georgia,serif;padding:clamp(24px,4vw,64px)}
  .wrap{max-width:1160px;margin:0 auto}
  h1{font-size:clamp(26px,3.2vw,40px);margin:0 0 8px}
  .sub{color:var(--muted);margin:0 0 40px;max-width:36em}
  .row{display:flex;align-items:center;gap:clamp(18px,3vw,46px);padding:26px 0;border-top:1px solid var(--hair);flex-wrap:wrap}
  .row .tag{width:96px;font:11px/1.8 "DejaVu Sans Mono",monospace;letter-spacing:.12em;color:var(--muted)}
  .row .tag b{display:block;font-size:15px;color:var(--ink);letter-spacing:0}
  .row .desc{flex:1;min-width:180px;font-size:13px;color:var(--muted)}
  .stage{height:340px;display:flex;align-items:center}
  @media(max-width:820px){.stage{height:auto}}
</style>
</head>
<body>
<div class="wrap">
  <h1>从 44 到 280，<em>同一枚开关</em></h1>
  <p class="sub">尺寸只由高度决定，宽度永远是 1.82 倍。同一套代码，在设置项里是一道亮边，在首屏里是一扇窗。</p>

  <div class="row">
    <div class="tag"><b>280</b>展示尺寸</div>
    <diorama-switch room="rest" height="280" value="1"></diorama-switch>
    <div class="desc">首屏用 280–400px。房间是主体，球只是它前面的一颗透镜。</div>
  </div>

  <div class="row">
    <div class="tag"><b>150</b>设置页</div>
    <diorama-switch room="cyber" height="150" value="0.85"></diorama-switch>
    <div class="desc">150px。灯位与窗位仍然读得出来，视差也还在。</div>
  </div>

  <div class="row">
    <div class="tag"><b>88</b>列表行</div>
    <diorama-switch room="garden" height="88" value="0"></diorama-switch>
    <div class="desc">88px。场景退成一层色光，还认得出是一间房，但不再需要认出家具。</div>
  </div>

  <div class="row">
    <div class="tag"><b>44</b>最小可用</div>
    <diorama-switch room="station" height="44" value="1"></diorama-switch>
    <div class="desc">44px。只剩一个反光点 —— 这时候它必须能被一眼读成「开 / 关」。</div>
  </div>
</div>
<script type="module" src="../src/diorama-switch.js"></script>
</body>
</html>
